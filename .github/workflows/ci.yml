name: CI
on:
  pull_request:
  push:
    branches: [ master, main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/TokenPay.sln
      - run: dotnet build src/TokenPay.sln --no-restore
      - run: dotnet test src/TokenPay.sln --no-build
