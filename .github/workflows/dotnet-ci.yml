name: .NET CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore src/TokenPay.sln
      - run: dotnet build src/TokenPay.sln --no-restore
      - run: dotnet test src/TokenPay.sln --no-build
